<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEXUS OCR</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  /* Paksa font-size base mengikuti lebar layar nyata */
  font-size: calc(12px + 0.5vw);
}

html, body {
  width: 100%;
  max-width: 100%;
  min-height: 100vh;
  overflow-x: hidden;
}

body {
  background: #090b14;
  background-image: radial-gradient(circle at 50% 30%, #1b1635 0%, #090b14 70%);
  background-repeat: no-repeat;
  background-size: cover;
  font-family: 'Fira Code', monospace;
  color: white;
  /* Padding pakai vw supaya proporsional */
  padding: 2vw;
  min-height: 100vh;
}

.container {
  width: 100%;
  background: #111522;
  border: 1px solid rgba(0,255,255,.15);
  border-radius: 3vw;
  padding: 3vw;
  box-shadow:
    0 0 20px rgba(0,0,0,.5),
    0 0 12px rgba(0,255,255,.08);
}

.status-tag {
  display: inline-block;
  margin-bottom: 3vw;
  padding: 1vw 2vw;
  border: 1px solid #00eaff;
  border-radius: 1vw;
  font-size: clamp(.5rem, 2vw, .75rem);
  color: #00eaff;
  letter-spacing: .03em;
}

/* Judul pakai vw agar selalu fit di layar */
.title {
  font-family: 'Orbitron', sans-serif;
  font-size: clamp(1.4rem, 10vw, 3.5rem);
  font-weight: 900;
  line-height: 1;
  margin-bottom: 2vw;
  text-align: center;
  white-space: nowrap;
  text-shadow:
    0 0 10px rgba(255,255,255,.7),
    0 0 24px rgba(0,234,255,.8);
}

.title span { color: #00eaff; }

.subtitle {
  text-align: center;
  font-size: clamp(.55rem, 2vw, .8rem);
  line-height: 1.6;
  color: #7380a8;
  margin-bottom: 3vw;
}

.main-grid {
  display: flex;
  flex-direction: column;
  gap: 3vw;
}

/* UPLOAD BOX */
.upload-box {
  position: relative;
  min-height: 35vw;
  border: 2px dashed rgba(0,234,255,.25);
  border-radius: 3vw;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3vw;
  background: rgba(255,255,255,.02);
  overflow: hidden;
}

.upload-box input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
  z-index: 2;
}

.upload-icon {
  font-size: clamp(2rem, 8vw, 3.5rem);
  color: #00eaff;
  margin-bottom: 2vw;
  text-shadow: 0 0 18px rgba(0,234,255,.8);
}

.upload-title {
  font-size: clamp(.7rem, 3vw, 1rem);
  line-height: 1.5;
}

.upload-sub {
  margin-top: 1vw;
  font-size: clamp(.55rem, 2vw, .75rem);
  color: #7380a8;
}

#image-preview {
  width: 100%;
  max-height: 35vw;
  object-fit: contain;
  display: none;
  border-radius: 2vw;
}

/* RESULT */
.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1.5vw;
  font-size: clamp(.55rem, 2vw, .8rem);
  color: #a100ff;
}

textarea {
  width: 100%;
  height: 35vw;
  min-height: 120px;
  background: #05070f;
  border: 1px solid rgba(161,0,255,.2);
  border-radius: 2.5vw;
  padding: 2.5vw;
  resize: vertical;
  color: white;
  font-family: 'Fira Code', monospace;
  font-size: clamp(.65rem, 2.5vw, .9rem);
  line-height: 1.7;
}

/* STATUS */
.status-container {
  display: none;
  margin-top: 3vw;
}

.status-text {
  display: flex;
  justify-content: space-between;
  font-size: clamp(.55rem, 2vw, .8rem);
  margin-bottom: 1.5vw;
  color: #00eaff;
}

.progress-bg {
  width: 100%;
  height: 6px;
  background: #1a1f2d;
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #00eaff, #a100ff);
  transition: width 0.3s ease;
}

/* BUTTONS */
.btn-container {
  display: flex;
  gap: 2vw;
  margin-top: 3vw;
}

button {
  flex: 1;
  padding: 3vw 2vw;
  border: none;
  border-radius: 2.5vw;
  background: transparent;
  font-family: 'Fira Code', monospace;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .2s, transform .2s;
  font-size: clamp(.65rem, 2.5vw, .9rem);
  white-space: nowrap;
}

#btn-copy {
  border: 1px solid #a100ff;
  color: #a100ff;
}

#btn-copy:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

#btn-reset {
  border: 1px solid #00eaff;
  color: #00eaff;
}

button:active:not(:disabled) {
  transform: scale(.97);
  opacity: .85;
}

footer {
  text-align: center;
  margin-top: 3vw;
  font-size: clamp(.5rem, 1.8vw, .7rem);
  color: #6c769c;
}
</style>
</head>
<body>

<script>
  atOptions = {
    'key' : 'f7282050e3822e193c6da0c6482b43fe',

    'height' : 90,

    'params' : {}
  };
</script>
<script src="https://www.highperformanceformat.com/f7282050e3822e193c6da0c6482b43fe/invoke.js"></script>


<div class="container">
  <div class="status-tag">SYS_STATUS: ACTIVE</div>

  <h1 class="title">NEXUS <span>OCR</span></h1>

  <p class="subtitle">
    EKSTRAKSI GAMBAR KE TEKS SECARA INSTAN VIA CLIENT-SIDE AI
  </p>

  <div class="main-grid">

    <div class="upload-box">
      <div id="upload-prompt">
        <div class="upload-icon">⎋</div>
        <div class="upload-title">KLIK ATAU SERET GAMBAR KE SINI</div>
        <div class="upload-sub">PNG, JPG, WEBP</div>
      </div>
      <input type="file" id="file-input" accept="image/*">
      <img id="image-preview" alt="Preview">
    </div>

    <div>
      <div class="panel-header">
        <span>[ OUTPUT_DECODED_TEXT ]</span>
        <span id="word-count">0 KARAKTER</span>
      </div>
      <textarea
        id="output-text"
        readonly
        placeholder="Hasil ekstrak teks akan muncul di sini..."
      ></textarea>
    </div>

  </div>

  <div class="status-container" id="status-box">
    <div class="status-text">
      <span id="status-label">INITIALIZING AI...</span>
      <span id="status-percent">0%</span>
    </div>
    <div class="progress-bg">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="btn-container">
    <button id="btn-copy" disabled>SALIN TEKS</button>
    <button id="btn-reset">RESET</button>
  </div>
</div>

<footer>© 2026 NEXUS CORE LABS</footer>

<script>
const fileInput     = document.getElementById('file-input');
const imagePreview  = document.getElementById('image-preview');
const uploadPrompt  = document.getElementById('upload-prompt');
const outputText    = document.getElementById('output-text');
const statusBox     = document.getElementById('status-box');
const statusLabel   = document.getElementById('status-label');
const statusPercent = document.getElementById('status-percent');
const progressFill  = document.getElementById('progress-fill');
const btnCopy       = document.getElementById('btn-copy');
const btnReset      = document.getElementById('btn-reset');
const wordCount     = document.getElementById('word-count');

fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (file) processImage(file);
});

function processImage(file) {
  const reader = new FileReader();
  reader.onload = e => {
    imagePreview.src = e.target.result;
    imagePreview.style.display = 'block';
    uploadPrompt.style.display = 'none';
  };
  reader.readAsDataURL(file);

  statusBox.style.display  = 'block';
  outputText.value         = 'Memproses gambar...';
  btnCopy.disabled         = true;
  progressFill.style.width = '0%';

  Tesseract.recognize(file, 'ind+eng', {
    logger: m => {
      if (m.status === 'recognizing text') {
        const p = Math.round(m.progress * 100);
        statusLabel.innerText    = 'MEMBACA TEKS...';
        statusPercent.innerText  = p + '%';
        progressFill.style.width = p + '%';
      }
    }
  }).then(({ data: { text } }) => {
    outputText.value         = text.trim();
    wordCount.innerText      = text.trim().length + ' KARAKTER';
    btnCopy.disabled         = false;
    statusLabel.innerText    = 'SELESAI ✓';
    statusPercent.innerText  = '100%';
    progressFill.style.width = '100%';
  }).catch(err => {
    outputText.value      = 'Error: ' + err.message;
    statusLabel.innerText = 'GAGAL';
  });
}

btnCopy.addEventListener('click', () => {
  navigator.clipboard.writeText(outputText.value).then(() => {
    const prev = btnCopy.innerText;
    btnCopy.innerText = 'TERSALIN!';
    setTimeout(() => { btnCopy.innerText = prev; }, 2000);
  });
});

btnReset.addEventListener('click', () => {
  fileInput.value              = '';
  imagePreview.style.display   = 'none';
  imagePreview.src             = '';
  uploadPrompt.style.display   = 'block';
  outputText.value             = '';
  statusBox.style.display      = 'none';
  progressFill.style.width     = '0%';
  statusPercent.innerText      = '0%';
  statusLabel.innerText        = 'INITIALIZING AI...';
  wordCount.innerText          = '0 KARAKTER';
  btnCopy.disabled             = true;
});
</script>

  };
</script>
